name: Build DR VIBE APK

on:
workflow_dispatch:
push:
branches:
- main
- master

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Check project files
    run: |
      ls -la
      find . -maxdepth 4 -type f -name "gradlew" -o -name "settings.gradle*" -o -name "build.gradle*"

  - name: Build APK
    run: |
      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
      else
        echo "ERROR: Gradle wrapper not found in repository root."
        exit 1
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: DR-VIBE-APK
      path: "**/build/outputs/apk/debug/*.apk"
      if-no-files-found: error
